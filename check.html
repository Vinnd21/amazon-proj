<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="/spec/shopping-cart/amazon.js"></script>
    <title>Amazon Checkout</title>
</head>
<body style="margin: 0; font-family: Arial, sans-serif; background-color: #f3f3f3;">
    
 
    <div style="max-width: 1400px; margin: 30px auto; padding: 0 30px;">
        
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px;">
            <div style="display: flex; align-items: center; gap: 15px;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon" style="width: 100px; height: auto;">
            </div>
            <h1 style="font-size: 28px; margin: 0; flex-grow: 1; text-align: center;">Checkout <span style="color: #007185;">(3 items)</span></h1>
            <div style="font-size: 24px;">🔒</div>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 400px; gap: 30px;">
            
            <div>
                <h2 style="font-size: 24px; margin-bottom: 20px; font-weight: bold;">Review your order</h2>

                <div id="cartContainer" style="background-color: white; border: 1px solid #ddd; border-radius: 8px; padding: 25px; margin-bottom: 20px;">
                </div>
            </div>
            
          
            <div>
                <div style="background-color: white; border: 1px solid #ddd; border-radius: 8px; padding: 25px; position: sticky; top: 20px;">
                    <h2 style="font-size: 20px; margin-top: 0; margin-bottom: 20px; font-weight: bold;">Order Summary</h2>
                    
                    <div style="border-bottom: 1px solid #ddd; padding-bottom: 15px; margin-bottom: 15px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <span style="font-size: 14px;">Items (3):</span>
                            <span style="font-size: 14px;">$42.75</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <span style="font-size: 14px;">Shipping & handling:</span>
                            <span style="font-size: 14px;">$4.99</span>
                        </div>
                    </div>
                    
                    <div style="border-bottom: 1px solid #ddd; padding-bottom: 15px; margin-bottom: 15px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <span style="font-size: 14px;">Total before tax:</span>
                            <span style="font-size: 14px;">$47.74</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span style="font-size: 14px;">Estimated tax (10%):</span>
                            <span style="font-size: 14px;">$4.77</span>
                        </div>
                    </div>
                    
                    <div style="margin-bottom: 25px;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-size: 18px; font-weight: bold; color: #b12704;">Order total:</span>
                            <span style="font-size: 18px; font-weight: bold; color: #b12704;">$52.51</span>
                        </div>
                    </div>
                    
                    <button style="width: 100%; background-color: #ffd814; border: 1px solid #fcd200; border-radius: 8px; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#f7ca00'" onmouseout="this.style.backgroundColor='#ffd814'">
                        Place your order
                    </button>
                </div>
            </div>
            
        </div>
    </div>
    
</body>
</html>
