<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" defer src="/src/amazon.js"></script>
  <link rel="stylesheet" href="CSS/check.css">
  <title>Amazon Checkout</title>
</head>
<body>
  <div class="checkout-container">
    <div class="checkout-header">
      <div class="header-left">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon" class="amazon-logo">
      </div>
      <h1 id="NumItems" class="checkout-title">Checkout </h1>
      <div class="lock-icon">🔒</div>
    </div>

    <div class="checkout-grid">
      <div>
        <h2 class="review-title">Review your order</h2>
        <div id="cartContainer" class="cart-container"></div>
      </div>

      <div id="order-summary-container">
        
      </div>
    </div>
  </div>
</body>
</html>
